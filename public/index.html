<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Search videos and channels, discover live broadcasts, and explore upcoming streams with Signal.">
  <title>Signal — YouTube video discovery</title>
  <link rel="icon" href="/signal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=20261014-theme">
  <script src="/app.js?v=20261014-theme" defer></script>
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <div class="topbar-left">
        <button id="nav-toggle" class="nav-toggle icon-button" type="button" aria-label="Collapse navigation" aria-expanded="true" aria-controls="primary-nav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <a class="brand" href="/" aria-label="Signal YouTube discovery home" title="Signal — YouTube discovery">
          <span class="youtube-logo" aria-hidden="true"><svg viewBox="0 0 29 20"><rect x="1" y="2" width="27" height="16" rx="5" fill="#ff0000"></rect><path d="m12 6 7 4-7 4z" fill="#fff"></path></svg></span>
          <span class="brand-name">YouTube</span><span class="brand-region">IN</span>
        </a>
      </div>

      <div class="search-tools">
        <form id="search-form" class="search-box" role="search">
          <label class="sr-only" for="search-input">Search</label>
          <input id="search-input" type="search" maxlength="120" placeholder="Search" autocomplete="off">
          <button class="search-button" type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
          </button>
        </form>
        <button id="voice-search" class="voice-button" type="button" aria-label="Search with your voice" title="Search with your voice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"></path></svg>
        </button>
      </div>

      <div class="topbar-actions">
        <a class="header-action action-create" href="https://www.youtube.com/create" target="_blank" rel="noopener noreferrer" aria-label="Create on YouTube" title="Create">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Create</span>
        </a>
        <a class="header-icon" href="https://www.youtube.com/feed/notifications" target="_blank" rel="noopener noreferrer" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg>
        </a>
        <button id="theme-toggle" class="header-icon theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.6 8.6 0 0 1 8.6 3.8a8.8 8.8 0 1 0 11.6 11.6Z"></path></svg>
          <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
        </button>
        <a class="sign-in" href="https://accounts.google.com/ServiceLogin?service=youtube&amp;continue=https%3A%2F%2Fwww.youtube.com%2F" target="_blank" rel="noopener noreferrer" aria-label="Sign in to YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg><span>Sign in</span>
        </a>
      </div>
    </header>

    <div class="app-shell">
      <aside id="primary-nav" class="sidebar" aria-label="Primary navigation">
        <nav class="sidebar-primary" aria-label="Discover">
          <button class="sidebar-item mode-tab is-active" type="button" data-mode="videos" data-duration="any" aria-pressed="true" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><span>Home</span>
          </button>
          <button class="sidebar-item mode-tab" type="button" data-mode="videos" data-duration="short" aria-pressed="false" aria-label="Shorts, videos under four minutes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.5 3.5-7 4.1a3.5 3.5 0 0 0-.1 6.1l7.2 4.1a3.5 3.5 0 0 0 3.5-6l-7.2-4.2"></path><path d="m9 11 5 3-5 3"></path></svg><span>Shorts</span>
          </button>
          <button class="sidebar-item mode-tab" type="button" data-mode="live" aria-pressed="false" aria-label="Live now">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle class="icon-fill-live" cx="12" cy="12" r="3"></circle></svg><span>Live</span>
          </button>
          <button class="sidebar-item mode-tab" type="button" data-mode="upcoming" aria-pressed="false" aria-label="Upcoming streams">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg><span>Upcoming</span>
          </button>
        </nav>

        <div class="sidebar-divider" aria-hidden="true"></div>
        <a class="sidebar-item sidebar-external" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="m10 9 5 3-5 3z"></path></svg><span>Open YouTube</span><span class="sidebar-arrow" aria-hidden="true">↗</span>
        </a>
      </aside>

      <main id="main-content" class="main-content" aria-label="YouTube discovery feed">
        <h1 class="sr-only">Signal video discovery</h1>
        <div id="feed-chips" class="feed-chips" role="group" aria-label="Filter videos">
          <button class="feed-chip is-active" type="button" data-category="all" data-mode="videos" data-duration="any" data-order="relevance" aria-pressed="true">All</button>
          <button class="feed-chip" type="button" data-category="live" data-mode="live" data-order="relevance" aria-pressed="false">Live</button>
          <button class="feed-chip" type="button" data-category="upcoming" data-mode="upcoming" data-order="relevance" aria-pressed="false">Upcoming</button>
          <button class="feed-chip" type="button" data-category="shorts" data-mode="videos" data-duration="short" data-order="relevance" title="Videos shorter than four minutes" aria-pressed="false">Shorts</button>
          <button class="feed-chip" type="button" data-category="long" data-mode="videos" data-duration="long" data-order="relevance" aria-pressed="false">Long videos</button>
          <button class="feed-chip" type="button" data-category="latest" data-mode="videos" data-duration="any" data-order="date" aria-pressed="false">Latest</button>
        </div>

        <section class="discovery" aria-label="YouTube video results">
          <div class="browse-bar">
            <div class="filters-group">
              <div class="sort-control duration-control">
                <label for="duration-select">Length</label>
                <select id="duration-select" aria-label="Filter by video length">
                  <option value="any">Any</option>
                  <option value="short">Under 4 min</option>
                  <option value="medium">4–20 min</option>
                  <option value="long">Over 20 min</option>
                </select>
                <span class="select-chevron" aria-hidden="true">⌄</span>
              </div>
              <div class="sort-control">
                <label for="sort-select">Sort</label>
                <select id="sort-select" aria-label="Sort results">
                  <option value="relevance">Relevance</option>
                  <option value="date">Newest</option>
                  <option value="viewCount">Most viewed</option>
                  <option value="rating">Top rated</option>
                </select>
                <span class="select-chevron" aria-hidden="true">⌄</span>
              </div>
            </div>
          </div>

          <div id="results-heading" class="results-heading" aria-live="polite">
            <div class="results-heading-main"><h2 id="results-title">A little inspiration</h2><button id="back-search" class="back-to-search" type="button" hidden>← Back to results</button><div id="channel-profile" class="channel-profile" hidden></div><div id="channel-tools" class="channel-tools" hidden></div></div>
            <span id="result-count" class="result-count"></span>
          </div>

          <div id="notice" class="notice" hidden role="status"></div>
          <div id="results" class="results-grid" aria-live="polite" aria-busy="false"></div>
          <div id="empty-state" class="empty-state" hidden>
            <span class="empty-mark" aria-hidden="true">∿</span>
            <h3>Nothing on this frequency. Yet.</h3>
            <p>Try a different search or tune into another section.</p>
          </div>
          <div class="load-row"><button id="load-more" class="load-more" type="button" hidden>Show more <span aria-hidden="true">↓</span></button></div>
        </section>

        <footer class="footer">
          <a class="footer-brand" href="/">Signal<span>.</span></a>
          <span>Independent discovery. Official YouTube playback.</span>
          <span class="footer-right">MADE FOR THE CURIOUS <span>✳</span></span>
        </footer>
      </main>
    </div>
  </div>

  <dialog id="detail-dialog" class="detail-dialog" aria-label="Video details">
    <button id="close-dialog" class="dialog-close" type="button" aria-label="Close video details">×</button>
    <div id="detail-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
